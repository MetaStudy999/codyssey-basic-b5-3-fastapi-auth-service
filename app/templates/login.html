{% extends "base.html" %}
{% block title %}로그인 - Project Flow{% endblock %}
{% block content %}
<h1>로그인</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login" class="form-card">
  <input type="hidden" name="next_path" value="{{ next_path }}">
  <label>아이디<input name="username" required autocomplete="username"></label>
  <label>비밀번호<input type="password" name="password" required autocomplete="current-password"></label>
  <button type="submit">로그인</button>
</form>
<p class="hint">테스트 계정은 README.md에 안내되어 있습니다.</p>
{% endblock %}
