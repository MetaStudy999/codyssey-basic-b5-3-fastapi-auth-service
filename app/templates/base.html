<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Project Flow{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
<header class="site-header">
  <a class="brand" href="/">Project Flow</a>
  <nav>
    {% if current_user %}
      <a href="/app/projects">내 프로젝트</a>
      <span class="welcome">{{ current_user.display_name }}님 환영합니다</span>
      <form class="inline" method="post" action="/logout"><button type="submit">로그아웃</button></form>
    {% else %}
      <a href="/login">로그인</a>
    {% endif %}
  </nav>
</header>
<main class="container">
  {% block content %}{% endblock %}
</main>
</body>
</html>
