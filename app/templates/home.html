{% extends "base.html" %}
{% block title %}홈 - Project Flow{% endblock %}
{% block content %}
<section class="hero">
  <h1>회원별 프로젝트와 할 일을 안전하게 관리합니다.</h1>
  <p>로그인한 사용자만 자신의 프로젝트를 보고, 할 일을 완료하거나 다시 열 수 있습니다.</p>
  {% if current_user %}
    <a class="button" href="/app/projects">핵심 기능으로 이동</a>
  {% else %}
    <a class="button" href="/login">로그인하고 시작하기</a>
  {% endif %}
</section>
{% endblock %}
