<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}B5-3 Project Task{% endblock %}</title>
  <style>
    body { font-family: sans-serif; max-width: 820px; margin: 0 auto; padding: 24px; line-height: 1.6; }
    nav { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 24px; }
    form { display: grid; gap: 10px; }
    input, button { font: inherit; padding: 8px; }
    article { border: 1px solid #ddd; padding: 14px; margin-bottom: 12px; }
    .error { color: #b00020; font-weight: 700; }
    .done { text-decoration: line-through; opacity: .65; }
  </style>
</head>
<body>
  <nav>
    <a href="/">홈</a>
    {% if current_user %}
      <a href="/app/projects">프로젝트</a>
      <span>{{ current_user }}님 환영합니다</span>
      <form method="post" action="/logout" style="display:inline"><button type="submit">로그아웃</button></form>
    {% else %}
      <a href="/login">로그인</a>
    {% endif %}
  </nav>
  {% block content %}{% endblock %}
</body>
</html>
